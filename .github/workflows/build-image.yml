name: Build patched Postiz image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  POSTIZ_VERSION: v2.25.3

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: POSTIZ_VERSION=${{ env.POSTIZ_VERSION }}
          push: true
          tags: |
            ghcr.io/red-valley/postiz-app:${{ env.POSTIZ_VERSION }}-li
            ghcr.io/red-valley/postiz-app:${{ env.POSTIZ_VERSION }}-li-b${{ github.run_number }}
